name: rdp

on:
  workflow_dispatch:

jobs:
  launch-win10:
    runs-on: ubuntu-latest
    timeout-minutes: 3600 # Будет работать до 6 часов (лимит GitHub)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tailscale on Ubuntu Host
        run: |
          curl -fsSL https://tailscale.com | sh
          
      - name: Connect to Tailscale Network
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-win10-host

      - name: Start Windows 10 inside Docker (QEMU KVM)
        run: |
          # Запуск контейнера Dockur/Windows. Он автоматически скачает чистый ISO Windows 10.
          # Выделяем машине 2 ядра и около 5 ГБ оперативной памяти (доступный максимум на бесплатном раннере).
          docker run -d \
            --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 3389:3389 \
            -e VERSION="10" \
            -e RAM="5G" \
            -e CORES="2" \
            -e USER="Skyro" \
            -e PASS="SecurePassword123!" \
            dockur/windows

      - name: Wait for Windows 10 Boot and Setup
        run: |
          echo "Windows 10 устанавливается и загружается в фоне..."
          echo "Это займет от 3 до 5 минут (скачивание ISO + автоустановка)."
          
          # Цикл проверки доступности RDP порта (3389) внутри контейнера
          for i in {1..60}; do
            if nc -z 127.0.0.1 3389; then
               echo "=== Windows 10 RDP Готов к подключению! ==="
               break
            fi
            sleep 10
          done

      - name: Display Connection Info
        run: |
          # Получаем IP адрес текущего Linux-раннера в сети Tailscale
          TS_IP=$(tailscale ip -4)
          
          echo -e "\n=============================================="
          echo -e "    ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ К WINDOWS 10 RDP   "
          echo -e "=============================================="
          echo -e "Адрес (Компьютер): $TS_IP"
          echo -e "Имя пользователя:  Skyro"
          echo -e "Пароль:            SecurePassword123!"
          echo -e "==============================================\n"

      - name: Keep Alive (Maintain Session)
        run: |
          # Держим воркфлоу активным, пока вы сами его не отмените (или пока не пройдут 6 часов)
          while true; do
            echo "[$(date)] Виртуальная машина Windows 10 активна. Подключайтесь через RDP."
            sleep 300
          done
```

---

### Как этим пользоваться?

1. **Tailscale Auth Key:** Убедитесь, что в настройках вашего репозитория (*Settings -> Secrets and variables -> Actions*) добавлен секрет `TAILSCALE_AUTH_KEY`. 
   * *Совет:* В панели управления Tailscale при создании ключа поставьте галочку **Ephemeral** (чтобы временные машины сами удалялись из вашего аккаунта после закрытия вкладки в GitHub) и **Reusable**.
2. **Запуск:** Перейдите во вкладку **Actions**, выберите воркфлоу `Windows 10 RDP via Tailscale` и нажмите **Run workflow**.
3. **Подключение:** Подождите примерно 4–5 минут. В логах шага `Display Connection Info` появится IP-адрес. Скопируйте его.
4. Откройте «Подключение к удаленному рабочему столу» (RDP) на вашем основном ПК, введите этот IP, а затем логин `Skyro` и пароль `SecurePassword123!`.

### В чем плюсы такой схемы перед вашим прошлым скриптом?
* Вы получаете **настоящую десктопную Windows 10 Enterprise** (Evaluation), а не Windows Server.
* Скрипт генерации пароля заменен на статичный (`SecurePassword123!`), чтобы вам не пришлось судорожно искать сгенерированный пароль в логах — вы можете подключиться сразу, как только машина поднимет порт.
* Контейнер сам проводит полностью автоматическую (unattended) установку ОС, настраивает пользователя и активирует RDP-сервер.

